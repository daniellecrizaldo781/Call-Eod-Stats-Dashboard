<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<title>Call Team Weekly Report</title>
<style>
:root{
  --pink:#E8578E; --pink-soft:#F7C9D9; --pink-bg:#FFF3F8;
  --blue:#4E9BE5; --blue-soft:#CBE2F7; --blue-bg:#F2F8FE;
  --lav:#D9CEF2; --mint:#C4E8D6; --peach:#FBD5BE; --yellow:#FBEFC0;
  --ink:#3A2A33; --muted:#9A8A92; --card:#FFFFFF; --line:#F3E3EA;
  --up:#2E9E6B; --down:#D9455F; --flat:#9A8A92;
  --shadow:0 10px 34px rgba(232,87,142,.13);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  background:linear-gradient(160deg,#FFF0F5 0%,#FDF3F8 40%,#F6EEFB 100%);
  color:var(--ink); overflow:hidden;
}
/* ---------------- top control bar ---------------- */
#bar{
  position:fixed; top:0; left:0; right:0; height:54px; z-index:50;
  display:flex; align-items:center; gap:14px; padding:0 20px;
  background:linear-gradient(100deg,#FFE6F1 0%,#FFD3E8 45%,#F9C9EC 100%);
  border-bottom:2px solid var(--pink);
  box-shadow:0 6px 20px rgba(224,69,123,.18);
}
#bar .brand{font-weight:800; font-size:15px; letter-spacing:-.2px; color:var(--ink); display:flex; align-items:center; gap:8px; white-space:nowrap;}
#bar .brand .bmark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--pink),#B14EAE);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;}
#bar .spacer{flex:1;}
#bar label{font-size:11px; font-weight:700; color:#A3547C; letter-spacing:.4px; text-transform:uppercase;}
#weekSel{
  font-family:inherit; font-size:13px; font-weight:700; color:var(--ink);
  background:#fff; border:1.5px solid var(--pink-soft); border-radius:999px;
  padding:7px 14px; cursor:pointer; min-width:180px;
}
#weekSel:focus{outline:none; border-color:var(--pink);}
#bar .btn{
  border:1.5px solid var(--pink-soft); background:#fff; color:var(--pink);
  font-weight:700; font-size:12.5px; padding:7px 13px; border-radius:999px; cursor:pointer;
  display:flex; align-items:center; gap:6px; white-space:nowrap;
}
#bar .btn:hover{border-color:var(--pink);}
#bar .btn.solid{background:linear-gradient(135deg,var(--pink),#D74F8A); color:#fff; border:none;}
/* ---------------- stage ---------------- */
#deck{position:fixed; top:54px; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:
  radial-gradient(1000px 500px at 80% 0%,rgba(246,231,250,.6),transparent),
  radial-gradient(800px 400px at 10% 100%,rgba(255,224,238,.5),transparent),
  linear-gradient(160deg,#FFF0F5 0%,#FDF3F8 40%,#F6EEFB 100%);}
.slide{
  position:absolute; width:min(94vw,1280px); height:min(92vh,720px);
  background:var(--card); border-radius:22px; box-shadow:var(--shadow);
  padding:34px 42px; overflow:hidden; display:flex; flex-direction:column;
  opacity:0; transform:translateX(42px) scale(.985); pointer-events:none;
  transition:opacity .35s ease, transform .35s ease;
}
.slide.active{opacity:1; transform:none; pointer-events:auto;}
.slide.prev{opacity:0; transform:translateX(-42px) scale(.985);}
/* slide header */
.shead{display:flex; align-items:center; gap:13px; margin-bottom:4px; flex:none;}
.snum{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pink),#C2509A);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(232,87,142,.35);flex:none;}
.stitle{font-size:25px; font-weight:800; letter-spacing:-.3px;}
.ssub{font-size:12.5px; color:var(--muted); margin-top:2px;}
.shead .weekbadge{margin-left:auto; font-size:12.5px; font-weight:700; color:var(--pink); background:var(--pink-bg); border:1px solid var(--pink-soft); padding:6px 15px; border-radius:999px; white-space:nowrap;}
.sbody{flex:1; display:flex; flex-direction:column; gap:16px; margin-top:14px; min-height:0; overflow:auto;}
.snote{font-size:11.5px; color:var(--muted); margin-top:10px; flex:none; font-style:italic;}

/* KPI cards */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
.kpi{background:linear-gradient(180deg,#FFFFFF,#FFF9FB); border:1px solid var(--line); border-radius:16px; padding:14px 16px; box-shadow:0 3px 12px rgba(232,87,142,.06);}
.kpi .lbl{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
.kpi .val{font-size:27px; font-weight:800; margin-top:4px; letter-spacing:-.5px;}
.kpi .sub{font-size:11.5px; margin-top:4px; color:var(--muted);}
.kpi.accent{background:linear-gradient(135deg,var(--pink),#F06BA0); color:#fff; border:none;}
.kpi.accent .lbl,.kpi.accent .sub{color:rgba(255,255,255,.9);}
.kpi.tot{background:linear-gradient(135deg,#FFE3EF,#FFF3F8); border-color:var(--pink-soft);}
.kpi.tot .val{color:var(--pink);}
.kpi.blue{background:linear-gradient(135deg,#E7F2FC,#F4FAFF); border-color:var(--blue-soft);}
.kpi.blue .val{color:#2E7FC4;}
.kpi.blue .lbl{color:#4E7BA8;}

/* delta chips */
.delta{font-weight:800; font-size:12px; padding:2px 9px; border-radius:999px; display:inline-block; white-space:nowrap;}
.delta.up{color:var(--up); background:rgba(46,158,107,.11);}
.delta.down{color:var(--down); background:rgba(217,69,95,.11);}
.delta.flat{color:var(--flat); background:rgba(154,138,146,.11);}

/* two-column */
.cols{display:grid; grid-template-columns:1fr 1fr; gap:22px; flex:1; min-height:0;}
.col{display:flex; flex-direction:column; gap:12px; min-height:0; background:#FFFBFD; border:1px solid var(--line); border-radius:18px; padding:18px 20px;}
.col h3{font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:9px; flex:none;}
.col h3 .dot{width:11px; height:11px; border-radius:50%; flex:none;}
.colh .subq{font-size:11.5px; color:var(--muted); font-weight:600;}
.mini-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; flex:none;}
.mk{background:#fff; border:1px solid var(--line); border-radius:13px; padding:10px 12px;}
.mk .l{font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
.mk .v{font-size:19px; font-weight:800; margin-top:3px;}

/* bar charts */
.bars{display:flex; flex-direction:column; gap:8px; flex:1; min-height:0; overflow:hidden;}
.bar-row{display:flex; align-items:center; gap:10px;}
.bar-lbl{width:150px; font-size:12px; font-weight:700; color:var(--ink); text-align:right; flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{flex:1; height:20px; background:#F7F0F4; border-radius:8px; overflow:hidden;}
.bar-fill{height:100%; border-radius:8px; min-width:0;}
.bar-val{width:88px; font-size:11.5px; font-weight:700; color:var(--muted); flex:none; text-align:left; white-space:nowrap;}
.bar-val b{color:var(--ink);}

/* tables */
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{font-size:10.5px; text-align:left; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; padding:7px 10px; border-bottom:2px solid var(--line);}
td{padding:8px 10px; border-bottom:1px solid #F7EDF2;}
tbody tr:last-child td{border-bottom:none;}
tr td:first-child{font-weight:700;}
.scrollbox{background:#FFFBFD; border:1px solid var(--line); border-radius:16px; padding:6px 4px; overflow:auto; flex:1; min-height:0;}

/* pill / chip */
.chiprow{display:flex; gap:10px; flex-wrap:wrap; flex:none;}
.pill{display:inline-flex; align-items:center; gap:7px; padding:7px 15px; border-radius:999px; font-size:12.5px; font-weight:800; border:1.5px solid var(--line); background:#fff;}
.pill.pink{color:var(--pink); border-color:var(--pink-soft); background:var(--pink-bg);}
.pill.blue{color:#2E7FC4; border-color:var(--blue-soft); background:var(--blue-bg);}
.pill .sw{width:9px;height:9px;border-radius:50%;}

.donut-wrap{display:flex;align-items:center;gap:16px;flex:1;min-height:0;}
.donut{position:relative;width:130px;height:130px;flex:none;}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .center .v{font-size:18px;font-weight:800;}
.donut .center .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
.legend .li{display:flex;align-items:center;gap:7px;font-size:12px;}
.legend .sw{width:11px;height:11px;border-radius:4px;flex:none;}
.legend .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.legend .pc{font-weight:700;color:var(--ink);}
.small{font-size:11px; color:var(--muted);}
.bigv{font-size:46px; font-weight:800; letter-spacing:-1px; line-height:1;}
.bigv small{font-size:18px; font-weight:700; color:var(--muted); letter-spacing:0;}

/* hero for slide 1 */
.hero{display:flex; flex-direction:column; gap:6px; flex:none;}
.hero .lbl{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
.herorow{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap;}
.heroL{flex:1; min-width:280px;}
.heroR{display:flex; gap:12px; flex-wrap:wrap;}

/* foot */
.foot{display:flex; align-items:center; justify-content:space-between; margin-top:12px; font-size:11.5px; color:var(--muted); flex:none;}
.foot .nvg{display:flex; align-items:center; gap:10px;}
.foot .dots{display:flex; gap:6px;}
.foot .dot{width:8px; height:8px; border-radius:50%; background:var(--pink-soft); cursor:pointer; transition:background .2s;}
.foot .dot.on{background:var(--pink);}
.fbtn{border:1px solid var(--pink-soft); background:#fff; color:var(--pink); font-weight:700; font-size:12px; padding:5px 12px; border-radius:999px; cursor:pointer;}
.fbtn:hover{border-color:var(--pink);}

@media(max-width:820px){
  .cols{grid-template-columns:1fr;}
  .slide{padding:22px 22px; width:94vw;}
  .bar-lbl{width:105px; font-size:11px;}
  .bigv{font-size:36px;}
}
/* vertical bars */
.vbars{display:flex; align-items:flex-end; gap:18px; flex:1; min-height:0; padding-top:10px;}
.vbar{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; height:100%;}
.vbar-val{font-size:11px; font-weight:800; color:var(--ink);}
.vbar-track{flex:1; width:100%; max-width:64px; background:#F7F0F4; border-radius:8px; display:flex; align-items:flex-end; overflow:hidden; min-height:40px;}
.vbar-fill{width:100%; border-radius:8px;}
.vbar-lbl{font-size:10px; color:var(--muted); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
/* inline legend */
.legend-inline{display:flex; gap:16px; flex:none; font-size:12px; font-weight:700; color:var(--ink);}
.legend-inline .li{display:inline-flex; align-items:center; gap:6px;}
.legend-inline .sw{width:11px;height:11px;border-radius:4px;}
/* nav arrows */
.navarrow{position:fixed; top:50%; transform:translateY(-50%); z-index:50; width:46px; height:46px; border-radius:50%; border:1.5px solid var(--pink-soft); background:rgba(255,255,255,.85); color:var(--pink); font-size:20px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(232,87,142,.18); transition:background .2s, transform .2s;}
.navarrow:hover{background:#fff; transform:translateY(-50%) scale(1.06);}
.navarrow.left{left:14px;}
.navarrow.right{right:14px;}
</style>
</head>
<body>
<div id="bar">
  <div class="brand"><span class="bmark">W</span> Call Team Weekly Report</div>
  <span class="spacer"></span>
  <label for="weekSel">Report Week</label>
  <select id="weekSel" aria-label="Select report week"></select>
  <button class="btn" id="btnPng" title="Download each slide as a high-res PNG">🖼️ PNG</button>
  <button class="btn" id="btnPrint" title="Save as PDF">🖨️ Print / PDF</button>
  <button class="btn solid" id="btnFull" title="Fullscreen">⛶ Full</button>
</div>

<div id="deck">
  <!-- slides injected here -->
</div>
<button class="navarrow left" id="btnPrev" title="Previous slide">◀</button>
<button class="navarrow right" id="btnNext" title="Next slide">▶</button>

<!--
  This report reuses the weeklyreport dashboard's shared deck.js + report-data.js
  (loaded from weeklyreport.daniellecrizaldo.com) so that any layout change to a
  slide there is reflected here automatically. We only render slides 2-6
  (skip slide 1 = Sales, skip the last 2 = Team Weekly Performance + Scorecard
  Record) by setting window.__REPORT_SLIDES before deck.js loads.
-->
<script>window.__REPORT_SLIDES = [2,3,4,5,6];</script>
<script src="https://weeklyreport.daniellecrizaldo.com/report-data.js"></script>
<script src="https://weeklyreport.daniellecrizaldo.com/deck.js"></script>
<script src="https://weeklyreport.daniellecrizaldo.com/html2canvas.min.js"></script>
<script src="https://weeklyreport.daniellecrizaldo.com/jszip.min.js"></script>
<script src="https://weeklyreport.daniellecrizaldo.com/png-export.js"></script>
</body>
</html>
