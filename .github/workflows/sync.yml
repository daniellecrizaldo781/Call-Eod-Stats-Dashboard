name: Sync dashboard data

# Refreshes data.js from the public Google Sheets on a schedule.
# Uses GitHub's built-in GITHUB_TOKEN — no personal token, no local Git Bash.
on:
  schedule:
    - cron: "7 * * * *"          # every hour at 7 minutes past
  workflow_dispatch: {}           # also runnable manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet openpyxl

      - name: Sync from Google Sheets
        env:
          OHA_SHEET: ${{ secrets.OHA_SHEET }}
          NONOHA_SHEET: ${{ secrets.NONOHA_SHEET }}
          BREAKDOWN_SHEET: ${{ secrets.BREAKDOWN_SHEET }}
          SCHED_SHEET: ${{ secrets.SCHED_SHEET }}
          BREAK_SHEET: ${{ secrets.BREAK_SHEET }}
          STATUS_SHEET: ${{ secrets.STATUS_SHEET }}
        run: python sync_sheets.py

      - name: Bump cache-buster in index.html
        # Build a CONTENT HASH of every source file (styles.css, all *.js, app-*.js,
        # index.html itself, plus data.js when it changed). The stamp changes ONLY
        # when the served assets actually changed, so browsers always re-fetch the
        # new CSS/JS and never stay stuck on stale cached assets.
        run: |
          STAMP=$(date +%Y%m%d)-$(cat styles.css app-*.js app-core.js data.js index.html 2>/dev/null | sha256sum | cut -c1-10)
          sed -i -E "s/\?v=[0-9A-Za-z-]+/?v=${STAMP}/g" index.html
          echo "cache-buster set to v=${STAMP}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js index.html
          # Always commit/push when index.html changed (stamp), even if data.js unchanged,
          # so CSS/JS edits propagate to browsers via a fresh cache-buster.
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: refresh data.js + bump cache-buster"
            git push
          fi
